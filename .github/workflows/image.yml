name: Image

on:
  # The image of a record on main is the one a deploy takes. A pull request
  # only shows that the image still builds: nothing of it is kept.
  push:
    branches: [main]
  pull_request:

# A newer record on the same branch makes the older run meaningless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    # The one job that may write to the container registry.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # As a deploy builds it: for the server, with the label by which Kamal
      # knows an image of this service, under the name of the record.
      - name: Build the image for the server
        run: |
          docker buildx build --platform linux/amd64 \
            --label service=patrol_call_system \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            --file Dockerfile --load .

      - name: Sign in to the container registry
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Keep the image of the record
        if: github.event_name == 'push'
        run: docker push --all-tags "$IMAGE"
