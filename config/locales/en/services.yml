# What the steps of a call answer and refuse — the board, the crew screen and
# the API pass these words on — and the notices on the phones of a crew.
en:
  services:
    call_step:
      unavailable: Car %{car} is not available
      accepted: Call accepted by %{car}
      arrived: Arrival recorded; response time %{minutes} min
      no_outcome: Choose an outcome to close the call
      # What a closing or a cancellation adds to the description of the call.
      closing_note: "Closing note: %{text}"
      cancellation_reason: "Cancelled: %{text}"
      finished: The call is %{status}; no further steps
      # UPD-11: a step out of its turn, with the steps possible in the status.
      not_possible:
        pending: "Not possible for a pending call; possible now: Dispatch, Cancel"
        dispatched: "Not possible for a dispatched call; possible now: Acceptance, Arrival, Cancel"
        accepted: "Not possible for an accepted call; possible now: Arrival, Cancel"
        on_scene: "Not possible for an on scene call; possible now: Close"
    backup_step:
      own_car: "%{car} raised this call and cannot be sent to it"
      accepted: Call accepted by %{car}
      arrived: Arrival of %{car} recorded
      released: "%{car} released"
      no_car_yet: The call has no car yet; dispatch one first
      already_released: "%{car} is released from this call"
    crew_notice:
      title: "%{priority} call: %{place}"
      reminder_title: "Reminder %{number} — %{priority} call: %{place}"
      unanswered: "%{address} · not accepted for %{minutes} min"
