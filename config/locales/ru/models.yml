# What the records say of themselves outside a refused form: what a call is
# and where, why a record cannot be deleted, how a car is tracked. The
# messages of refused fields stand in en.yml under activerecord.errors.
ru:
  models:
    alarm_call:
      summary: "Тревога: %{type}"
      detail: Зона %{zone}
    call:
      title: "%{summary} на объекте %{place}"
    # DEL-07: how many calls a deletion of old calls would take.
    call_cleanup:
      matching:
        zero: Условиям не соответствует ни один вызов
        one: "Условиям соответствует %{count} вызов"
        few: "Условиям соответствуют %{count} вызова"
        many: "Условиям соответствует %{count} вызовов"
        other: "Условиям соответствует %{count} вызова"
      matching_now:
        zero: сейчас условиям не соответствует ни один вызов
        one: "сейчас условиям соответствует %{count} вызов"
        few: "сейчас условиям соответствуют %{count} вызова"
        many: "сейчас условиям соответствует %{count} вызовов"
        other: "сейчас условиям соответствует %{count} вызова"
    client_call:
      summary: Вызов клиента
    guarded_site:
      kept_by_calls:
        one: С объектом связан %{count} вызов, поэтому удалить объект нельзя; вместо этого приостановите договор
        few: С объектом связано %{count} вызова, поэтому удалить объект нельзя; вместо этого приостановите договор
        many: С объектом связано %{count} вызовов, поэтому удалить объект нельзя; вместо этого приостановите договор
        other: С объектом связано %{count} вызова, поэтому удалить объект нельзя; вместо этого приостановите договор
    # DSP-05: the name of a mark on the map says what its colour and signs show.
    map_marker:
      site: "%{site}, вызов, приоритет %{priority}, %{state}"
      sos: SOS экипажа машины %{car}, %{state}
      far_from_signal: прибытие отмечено дальше %{metres} м от места сигнала
    patrol_car:
      # TRK-01: what a chosen source means for the car.
      tracked:
        not_tracked: "За машиной %{car} слежение не ведётся"
        traccar: "Слежение за машиной %{car} ведёт Traccar Client"
        crew_phone: "Слежение за машиной %{car} ведёт телефон экипажа"
      kept_by_crew:
        one: >-
          За машиной закреплён %{count} пользователь экипажа, поэтому удалить её нельзя; сначала переведите его
          на другую машину
        few: >-
          За машиной закреплено %{count} пользователя экипажа, поэтому удалить её нельзя; сначала переведите их
          на другую машину
        many: >-
          За машиной закреплено %{count} пользователей экипажа, поэтому удалить её нельзя; сначала переведите их
          на другую машину
        other: >-
          За машиной закреплено %{count} пользователя экипажа, поэтому удалить её нельзя; сначала переведите их
          на другую машину
      kept_by_calls:
        one: >-
          С машиной связан %{count} вызов, поэтому удалить её нельзя; вместо этого переведите её в статус
          «Не на службе»
        few: >-
          С машиной связано %{count} вызова, поэтому удалить её нельзя; вместо этого переведите её в статус
          «Не на службе»
        many: >-
          С машиной связано %{count} вызовов, поэтому удалить её нельзя; вместо этого переведите её в статус
          «Не на службе»
        other: >-
          С машиной связано %{count} вызова, поэтому удалить её нельзя; вместо этого переведите её в статус
          «Не на службе»
      kept_by_positions: >-
        Местоположения машины хранятся с %{day}, поэтому удалить её нельзя; вместо этого переведите её в статус
        «Не на службе»
    # BR-21: a crew that asks for help, and how well the place is known.
    sos_call:
      summary: SOS экипажа
      detail: Машина %{car}
      place: Экипаж %{car}
      title: "%{summary} машины %{car}"
      place_unknown: Место неизвестно
      accuracy: Точность местоположения %{metres} м
      accuracy_unknown: Точность местоположения неизвестна
      last_position: Последнее местоположение машины на %{time}
      last_position_accuracy: Последнее местоположение машины на %{time} · точность %{metres} м
    # USR-03: why a user stays; a call counts once.
    user:
      kept_by_calls:
        one: >-
          С пользователем связан %{count} вызов, поэтому удалить пользователя нельзя; вместо этого сделайте его
          неактивным
        few: >-
          С пользователем связано %{count} вызова, поэтому удалить пользователя нельзя; вместо этого сделайте
          его неактивным
        many: >-
          С пользователем связано %{count} вызовов, поэтому удалить пользователя нельзя; вместо этого сделайте
          его неактивным
        other: >-
          С пользователем связано %{count} вызова, поэтому удалить пользователя нельзя; вместо этого сделайте
          его неактивным
      kept_by_records:
        one: >-
          Местоположения или фотографии пользователя хранятся в %{count} вызове, поэтому удалить пользователя
          нельзя; вместо этого сделайте его неактивным
        few: >-
          Местоположения или фотографии пользователя хранятся в %{count} вызовах, поэтому удалить пользователя
          нельзя; вместо этого сделайте его неактивным
        many: >-
          Местоположения или фотографии пользователя хранятся в %{count} вызовах, поэтому удалить пользователя
          нельзя; вместо этого сделайте его неактивным
        other: >-
          Местоположения или фотографии пользователя хранятся в %{count} вызова, поэтому удалить пользователя
          нельзя; вместо этого сделайте его неактивным
