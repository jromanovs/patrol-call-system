# The users, managed by an administrator: the list, the form of a user and
# the dialog that sets a user's password.
ru:
  users:
    index:
      title: Пользователи
      new: Добавить пользователя
      name: Имя
      email_address: Адрес электронной почты
      role: Роль
      active: Активен
      last_sign_in: Последний вход
      is_active: "да"
      is_inactive: "нет"
      confirm_delete: Удалить пользователя %{name}?
    new:
      title: Новый пользователь
    edit:
      title: Изменение пользователя
      heading: Изменение пользователя %{name}
      password: Пароль
      own_html: Собственный пароль изменяется в %{link}, где запрашивается текущий.
      own_link: вашем профиле
      set_for_crew: "Задаётся только здесь администратором: экипаж свой пароль не изменяет."
      set_for_user: Задаётся здесь администратором; свой пароль пользователь изменяет в своём профиле.
      set_password: Задать новый пароль
    form:
      email_address: Адрес электронной почты
      car: Машина
      no_car: Нет
      hints:
        name: От 2 до 100 символов, напр., Демо Диспетчер
        email_address: "Пример: dispatcher@example.com"
        role: >-
          Диспетчер: вызовы, объекты и машины. Старший смены: также удаляет вызовы. Администратор: также
          пользователи. Экипаж: только вызов своей машины
        patrol_car_id: "Только для экипажа: машина, вызовы которой он обслуживает"
        password: От 12 до 72 символов
        active: Неактивный пользователь не может войти
    create:
      created: Пользователь создан
    update:
      updated: Пользователь изменён
    destroy:
      deleted: Пользователь удалён
  user_passwords:
    edit:
      title: Новый пароль пользователя %{name}
      signs_out: После сохранения для пользователя %{name} будет выполнен выход на всех устройствах.
      signs_out_crew: >-
        После сохранения для пользователя %{name} будет выполнен выход на всех устройствах, а уведомления на его
        телефонах прекратятся до тех пор, пока он снова не войдёт и не включит их.
      former_stops: Прежний пароль сразу перестаёт действовать.
      former_and_key_stop: Прежний пароль и ключ API сразу перестают действовать.
      submit: Задать пароль
    update:
      changed: Пароль пользователя %{name} изменён; на всех его устройствах выполнен выход
      changed_key_void: >-
        Пароль пользователя %{name} изменён; на всех его устройствах выполнен выход, ключ API больше не
        действует
    own: Собственный пароль изменяется в вашем профиле
