      statistics: Статистика
    theme:
      button: "Тема: %{theme}"
      label: Тема
    language:
      button: "Язык: %{language}"
      label: Язык
    account:
      button: Учётная запись, %{name}
      label: Учётная запись
      profile: Профиль
      api_key: Ключ API
      administration: Администрирование
      users: Пользователи
      tracking: Слежение
      settings: Настройки
      sign_out: Выйти
