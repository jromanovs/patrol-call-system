# The administrator's page of car tracking: the position source of every car,
# its identifier for Traccar Client, and for how long positions are kept.
ru:
  trackings:
    columns:
      car: Машина
      source: Источник местоположения
      identifier: Идентификатор устройства
      last_position: Последнее местоположение
    # TRK-01: each source in the words of the tracking page.
    sources:
      not_tracked: Без слежения
      traccar: Traccar Client
      crew_phone: Телефон экипажа
    show:
      title: Слежение за машинами
      sources_title: Источник местоположения каждой машины
      saved_at_once: Выбор сохраняется сразу.
      meaning_title: Источники
      not_tracked_html: "%{source} — местоположение не принимается, машина на карте не показывается."
      traccar_html: >-
        %{source} — бесплатное приложение на телефоне экипажа передаёт местоположение, в том числе при
        заблокированном телефоне. URL сервера — %{url}, идентификатор машины, точность определения
        местоположения — высокая. Идентификатор показывается один раз и при необходимости заменяется новым;
        местоположения с любым другим идентификатором отклоняются.
      crew_phone_html: >-
        %{source} — экран экипажа передаёт местоположение телефона каждые 30 секунд, пока он открыт; при
        заблокированном телефоне или другом приложении на экране данные не поступают. Устанавливать ничего
        не нужно.
    car:
      source_of: Источник местоположения машины %{car}
      not_needed: не нужен
      never: Не поступало
      confirm_replace: Заменить идентификатор машины %{car}? Текущий сразу перестанет действовать.
      issue_html: Выдать идентификатор %{whose}
      replace_html: Новый идентификатор %{whose}
      whose: для машины %{car}
    issued:
      title: Новый идентификатор машины %{car} — показывается только один раз
      copy: Скопировать
      copied: Скопировано
      not_copied: "Не скопировано: идентификатор выделен, скопируйте его вручную."
      press_copy_html: Нажмите кнопку %{copy}
      copy_at_end: Скопировать.
      paste_html: >-
        В Traccar Client откройте настройки: вставьте его в поле %{field} URL сервера — %{url}; точность
        определения местоположения — высокая.
      field_in_list: Идентификатор устройства;
      switch_on_html: Включите в Traccar Client непрерывное отслеживание, затем нажмите здесь %{done}.
      done: Готово
      after_done: >-
        После нажатия «Готово», а также после ухода с этой страницы или её перезагрузки идентификатор больше не
        показывается; перезагрузка не выдаёт новый.
    kept:
      kept_html: Местоположения машин хранятся %{months}; каждую ночь в 03:30 более старые удаляются.
    choose_source:
      no_source: Выберите источник местоположения
    issue_key:
      not_traccar: "Слежение за машиной %{car} ведётся не через Traccar Client"
