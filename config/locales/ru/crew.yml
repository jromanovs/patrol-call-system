# The crew's screen on a phone: its call and the steps of it, the notices,
# the phone as the position source of the car, and the SOS with its question.
ru:
  crews:
    show:
      call_for: "Вызов для %{car}: %{place}, приоритет %{priority}, %{state}"
      # BR-22: where a further car is, at the end of that sentence.
      further_car:
        sent: отправлена как дополнительная машина
        on-the-way: в пути как дополнительная машина
        on-site: на месте как дополнительная машина
        far: на месте как дополнительная машина
      no_call: Нет вызова для %{car}
      since_call: с момента вызова
      keyholder: Ответственное лицо
      access: Доступ
      signal_times: Сигнал в %{first}, последний в %{last}
      sent_with: "Вместе с вами на вызове: %{cars}"
      idle: >-
        Вызов появится здесь, как только диспетчер отправит эту машину, а при включённых уведомлениях — ещё и
        уведомлением на этом телефоне.
    steps:
      route: Маршрут
      accept: Принять вызов
      reminders_stopped: Напоминания прекращены; диспетчер видит, что вызов не принят.
      reminders: Пока уведомления включены, напоминание звучит каждую минуту до принятия вызова, не более %{count} раз.
      close: Закрыть вызов
      position_recorded: При нажатии «Прибыл» и «Закрыть вызов» записывается местоположение этого телефона.
    backup_steps:
      on_site: >-
        На месте как дополнительная машина. Машина снова станет свободной, когда диспетчер её освободит или
        вызов завершится.
    notices:
      label: Уведомления
      "on": Уведомления на этом телефоне включены
      "off": Уведомления на этом телефоне выключены
      blocked: Уведомления на этом телефоне заблокированы; разрешите их в настройках телефона
      unavailable: >-
        Этот браузер не показывает уведомления. На iPhone добавьте приложение на экран «Домой» и откройте его
        оттуда
      turn_on: Включить уведомления
      turn_off: Выключить уведомления
    position:
      label: Местоположение
      sending: Этот телефон передаёт местоположение машины
      every_html: "Каждые 30 секунд, пока открыт этот экран. Последняя передача: %{time}"
      silent: Телефон не сообщает местоположение
      allow: Разрешите этому приложению доступ к местоположению в настройках телефона.
    sos_state:
      sent_to_you:
        one: "К вам отправлена машина %{cars}"
        few: "К вам отправлены машины %{cars}"
        many: "К вам отправлены машины %{cars}"
        other: "К вам отправлены машины %{cars}"
      seen: Диспетчер увидел ваш SOS
      sent: SOS отправлен в %{time}
      dispatched_at: "%{car} отправлена в %{time}"
      sent_at: "%{car} отправлена в %{time}"
      accepted_at: приняла вызов в %{time}
      arrived_at: прибыла в %{time}
      acknowledged: Отправлен в %{sent} · получение подтверждено в %{seen}
      not_acknowledged: Диспетчер ещё не подтвердил получение.
    sos:
      title: Экипажу нужна помощь
      again: Отправить SOS ещё раз
  crew_sos:
    new:
      title: Отправить SOS?
      note: Диспетчер получит сообщение, что экипажу машины %{car} нужна помощь, и местоположение этого телефона.
      submit: Отправить SOS
      failed: >-
        Не отправлено: сервер не отвечает. Нажмите «Отправить SOS» ещё раз или свяжитесь с диспетчером по
        рации.
      not_now: Не сейчас
      nothing_sent: >-
        Ничего не отправляется, пока не нажата кнопка «Отправить SOS». Без выбора вопрос закроется сам через
        15 секунд.
    create:
      too_many: Слишком много сигналов за минуту; ваш SOS уже у диспетчера
      not_sent: SOS не отправлен. Нажмите SOS ещё раз или свяжитесь с диспетчером по рации
  # CRW-01: what a phone tells of the application when it is installed.
  pwa:
    manifest:
      description: Вызовы патрульных машин и вызов своего экипажа.
