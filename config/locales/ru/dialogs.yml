# The dialogs of the steps of a call: send a car, send another car, close,
# cancel; and what the board says after a step. Inside a dialog a view asks
# for its words by their full keys: a short key would be looked up among the
# words of the dialog itself.
ru:
  dispatches:
    new:
      title: Отправка машины
      about: "%{call}, район: %{district}"
      no_cars: Свободных машин нет.
    create:
      dispatched: "Машина %{car} отправлена на вызов: %{place}"
  backups:
    new:
      title: Отправка ещё одной машины
      about: "%{call}, район: %{district}. Уже на вызове: %{cars}."
      no_cars: Свободных машин нет.
    create:
      sent: "Машина %{car} отправлена дополнительной на вызов: %{place}"
  closings:
    new:
      title: Закрытие вызова
      outcome: Результат
      outcome_hint: Что обнаружил экипаж; обязательно
      choose_outcome: Выберите результат
      note: Примечание
      note_hint: Добавляется к описанию, напр., Неисправность датчика в зоне 7
      submit: Закрыть вызов
    create:
      closed: Вызов закрыт
  cancellations:
    new:
      title: Отмена вызова
      reason: Причина
      reason_hint: Добавляется к описанию, напр., Клиент перезвонил
      submit: Отменить вызов
    create:
      cancelled: Вызов отменён
  acknowledgements:
    create:
      acknowledged: Получение SOS от %{car} подтверждено
