# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  activerecord:
    attributes:
      call:
        guarded_site: "Site"
        received_at: "Time received"
      guarded_site:
        site_type: "Type"
        client_name: "Client"
        contract_start_date: "Contract start"
      # USR-06: the names the refusals of a change of the password begin with.
      user:
        password_challenge: "Current password"
        password_confirmation: "The two new passwords"
    errors:
      models:
        user:
          attributes:
            password_challenge:
              invalid: "is wrong"
            password_confirmation:
              confirmation: "differ"
  date:
    formats:
      default: "%d.%m.%Y"
  calls:
    filter_fields:
      labels:
        status: "Status"
        priority: "Priority"
        kind: "Call type"
        district: "District"
        site_id: "Site"
        car_id: "Car"
        from: "From"
        to: "To"
  guarded_sites:
    form:
      hints:
        site_type: "Apartment, house, office, shop or warehouse"
        district: "District of the monitoring company; free cars of it are offered first"
        contract_status: "A suspended contract refuses new calls"
  time:
    formats:
      # BR-10: DD.MM.YYYY HH:MM
      default: "%d.%m.%Y %H:%M"
