production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # STO-06: the map of Latvia, rebuilt when it is missing or 30 days old or older.
  build_map:
    class: MapBuildJob
    schedule: "0 3 * * * Europe/Riga"
  # TRK-05, BR-20: car positions older than the administrator's period go.
  prune_car_positions:
    class: CarPositionPruneJob
    schedule: "30 3 * * * Europe/Riga"
